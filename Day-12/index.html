<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background-color:#111;
            color:white;
            font-family:Arial, sans-serif;
            padding:30px;
        }

        .container{
            max-width:900px;
            margin:auto;
        }

        .search-box{
            display:flex;
            gap:10px;
        }

        input{
            flex:1;
            padding:12px;
            border:none;
            border-radius:8px;
            outline:none;
        }

        button{
            padding:12px 20px;
            border:none;
            border-radius:8px;
            background:gold;
            cursor:pointer;
        }

        .main{
            margin-top:30px;
        }

        #mainTemp{
            font-size:50px;
            margin-top:10px;
        }

        .details{
            display:flex;
            gap:40px;
            margin-top:20px;
        }

        .box{
            background:#222;
            padding:20px;
            border-radius:10px;
            gap:50px;
            margin-right :30px
            
        }

        #forecastCards{
            display:flex;
            gap:15px;
            margin-top:30px;
            flex-wrap:wrap;
        }

        .card{
            background:#222;
            width:120px;
            padding:15px;
            border-radius:10px;
            text-align:center;
        }

        .card h4{
            margin-bottom:10px;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Weather Dashboard</h1>

    <div class="search-box">
        <input
            type="text" id="searchInput" placeholder="Enter city name">

        <button onclick="getWeatherData()">
            Search
        </button>
    </div>

    <div class="main">

        <h2 id="nameText">City</h2>

        <h1 id="mainTemp">0°C</h1>

        <p id="weatherstatus">Weather Status</p>

        <div class="details">

            <div class="box ">
                <h3>Humidity</h3>
                <p id="humidityVal">0%</p>
            </div>

            <div class="box">
                <h3>Wind</h3>
                <p id="windVal">0 m/s</p>
            </div>

        </div>

        <h2 style="margin-top:30px;">5-Day Forecast</h2>

        <div id="forecastCards">

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
